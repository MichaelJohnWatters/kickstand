<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kickstand — Rider Training Platform</title>
  <link rel="stylesheet" href="app/tokens.css" />
  <style>
    /* Marketing wrapper background — a few shades darker than the
       app's --bg (oklch 0.969) so the iframe edge is visible. Override
       --bg AFTER tokens.css so the JSX shell + launcher inherit the
       darker tone. The iframed Flutter app is isolated and keeps its
       own --bg, giving us the visual edge we want. */
    :root {
      --bg:     oklch(0.93 0.008 275);  /* wrapper — darker */
      --app-bg: oklch(0.969 0.006 275); /* matches the iframed app's --bg */
    }
    html, body { height: 100%; background: var(--bg); }
    #root { height: 100%; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
