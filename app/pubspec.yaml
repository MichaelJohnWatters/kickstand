name: kickstand
description: "Kickstand — UK motorcycle training school management. Student / Instructor / Admin (one app, role-aware)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.0

  # Routing with auth-gate redirects
  go_router: ^14.6.0

  # HTTP client
  dio: ^5.7.0

  # Token storage (Keychain on iOS, Keystore on Android, localStorage on web)
  flutter_secure_storage: ^9.2.0

  # Fonts loaded at runtime (no asset bundling for dev simplicity)
  google_fonts: ^6.2.0

  # Time formatting / parsing
  intl: ^0.20.0

  # Camera / gallery picker for expense receipts. file_picker is the
  # fallback for non-image receipts (PDFs etc.) when the instructor
  # uploads from Files / Downloads.
  image_picker: ^1.1.2
  file_picker: ^8.1.4

  # Disk + memory cache for receipt images. Receipts are immutable
  # post-upload so we cache aggressively (default ~100MB cap, LRU).
  cached_network_image: ^3.4.1

  # Open external URLs (Google Maps for location addresses, etc).
  url_launcher: ^6.3.1

  # Firebase Auth (Phase 0 — installed but not exercised yet; Phase 3
  # of firebase-auth-migration.md replaces the rolled-own login flow).
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1

  # Live-map view for the manager GPS screen. OSM tiles via flutter_map —
  # no API key, no billing. latlong2 is its companion coords type.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Static seed payloads for the demo-mode build — produced by
  # `make demo-data` from a live backend, so the JSON shapes match
  # what ApiClient already parses.
  assets:
    - assets/demo/
    - assets/demo/bike_expenses/
