# Litestream: continuously replicate the SQLite DB to object storage so a lost
# volume doesn't mean lost data, with point-in-time restore. Active only when
# LITESTREAM_BUCKET is set (see docker-entrypoint.sh); otherwise the server runs
# without backups (dev / not-yet-configured).
#
# Provide via secrets (S3 or any S3-compatible store — Cloudflare R2,
# Backblaze B2, Tigris on Fly):
#   LITESTREAM_ACCESS_KEY_ID, LITESTREAM_SECRET_ACCESS_KEY  (read automatically)
#   LITESTREAM_BUCKET, LITESTREAM_ENDPOINT, LITESTREAM_REGION
#
# Retention 30 days — keep in step with the object store's lifecycle rule.
dbs:
  - path: /data/kickstand.db
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: kickstand.db
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        retention: 720h
