                  <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                    <span style={{ fontWeight: 800, fontSize: 16 }}>{p.name}</span>
                    <Badge tone="warning" size="sm">Pending</Badge>
                  </div>
                  <div style={{ fontSize: 12.5, color: 'var(--ink-3)', marginTop: 1 }}>Pursuing cat {p.cat} · applied {p.applied}</div>
                </div>
                <a href={`tel:${p.phone.replace(/\s/g, '')}`} style={{ textDecoration: 'none' }}><Btn size="sm" variant="secondary" icon="phone">{p.phone}</Btn></a>
              </div>
              {p.note && (
                <div style={{ marginTop: 12, padding: '10px 12px', borderRadius: 10, background: 'var(--surface-2)', fontSize: 13, color: 'var(--ink-2)', display: 'flex', gap: 8, alignItems: 'flex-start' }}>
                  <Icon name="info" size={15} sw={2.1} style={{ color: 'var(--ink-4)', flexShrink: 0, marginTop: 1 }} />{p.note}
                </div>
              )}
              <div style={{ display: 'flex', gap: 8, marginTop: 13 }}>
                <Btn full size="sm" variant="success" icon="check" onClick={() => decide(p.id, true)}>Approve</Btn>
                <Btn full size="sm" variant="secondary" icon="x" onClick={() => decide(p.id, false)}>Reject</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}

  );
}

function EmptyState({ icon, title, msg }) {

}

Object.assign(window, { SignupsScreen, EmptyState });

// Kickstand — Manager: instructor pay (owed-tracking, NOT payroll).
// Per-instructor earned / paid / outstanding, record earning + payment, pay-model config.
const { useState: useStatePay } = React;

const payUnit = (basis) => basis === 'percentage' ? '%' : '£';
function payModelSummary(p) {
  const m = {
    percentage: `${p.rate}% of session revenue`,
    'per-day': `£${p.rate} per day`,
    'per-session': `£${p.rate} per session`,
    'per-hour': `£${p.rate} per hour`,
    'per-student': `£${p.rate} per student`,
    salary: 'Salaried · not tracked here',
  }[p.basis] || '—';
  return p.perCourse && p.perCourse.mod2 ? `${m} · Mod 2 ${payUnit(p.basis)}${p.perCourse.mod2}` : m;
}

function InstructorPayScreen({ fire }) {
  const [pay, setPay] = useStatePay(INSTRUCTOR_PAY);
  const [modal, setModal] = useStatePay(null); // {type, id}
  const tracked = INSTRUCTORS.filter(i => pay[i.id].basis !== 'salary');
  const totalOwed = tracked.reduce((a, i) => {
    const p = pay[i.id];
    return a + (p.earnings.reduce((s, e) => s + e.amount, 0) - p.payments.reduce((s, x) => s + x.amount, 0));
  }, 0);
  const owedFor = (id) => { const p = pay[id]; return p.earnings.reduce((s, e) => s + e.amount, 0) - p.payments.reduce((s, x) => s + x.amount, 0); };

  const addEarning = (id, d) => { setPay(p => ({ ...p, [id]: { ...p[id], earnings: [{ id: 'ie' + Date.now(), ...d }, ...p[id].earnings] } })); fire('Earning recorded', 'check-circle'); };
  const addPayment = (id, d) => { setPay(p => ({ ...p, [id]: { ...p[id], payments: [{ id: 'ip' + Date.now(), ...d }, ...p[id].payments] } })); fire('Instructor payment recorded', 'check-circle'); };
  const setModel = (id, d) => { setPay(p => ({ ...p, [id]: { ...p[id], ...d } })); fire('Pay model updated', 'check-circle'); };

  return (
    <div className="ks-screen">
      <PageHead title="Instructor pay" sub="What the school owes its instructors. Owed-tracking — feeds your payroll, doesn't replace it." />
      <Card pad={16} style={{ marginBottom: 18, display: 'flex', alignItems: 'center', gap: 18, background: 'linear-gradient(120deg, var(--primary-deep), var(--primary))', color: '#fff', border: 'none' }}>
        <div style={{ width: 50, height: 50, borderRadius: 14, display: 'grid', placeItems: 'center', background: 'rgba(255,255,255,.18)' }}><Icon name="card" size={26} /></div>
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: 13, opacity: .85, fontWeight: 600 }}>Total outstanding to instructors</div>
          <div style={{ fontWeight: 800, fontSize: 32, letterSpacing: '-0.03em', lineHeight: 1.1 }}>£{totalOwed.toFixed(2).replace(/\.00$/, '')}</div>
        </div>
        <div style={{ fontSize: 12.5, opacity: .9, textAlign: 'right', maxWidth: 180, lineHeight: 1.4 }}>Across {tracked.length} tracked instructors · end-of-week payout view</div>
      </Card>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        {INSTRUCTORS.map(i => {
          const p = pay[i.id], salary = p.basis === 'salary';
          const earned = p.earnings.reduce((s, e) => s + e.amount, 0);
          const paid = p.payments.reduce((s, x) => s + x.amount, 0);
          const owed = earned - paid;
          return (
            <Card key={i.id} pad={0} style={{ overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 13, padding: 16, borderBottom: salary ? 'none' : '1px solid var(--border)' }}>
                <Avatar initials={i.initials} tone={i.tone} size={44} />
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 800, fontSize: 16 }}>{i.name}</div>
                  <div style={{ fontSize: 12.5, color: 'var(--ink-3)', display: 'flex', alignItems: 'center', gap: 5 }}><Icon name="gauge" size={13} sw={2.1} />{payModelSummary(p)}</div>
                </div>
                {!salary && (
                  <div style={{ display: 'flex', gap: 24, alignItems: 'center', marginRight: 8 }}>
                    <Stat label="Earned" value={`£${earned.toFixed(2).replace(/\.00$/, '')}`} />
                    <Stat label="Paid" value={`£${paid.toFixed(2).replace(/\.00$/, '')}`} />
                    <Stat label="Outstanding" value={`£${owed.toFixed(2).replace(/\.00$/, '')}`} tone={owed > 0 ? 'var(--danger)' : 'var(--success)'} />
                  </div>
                )}
                <button onClick={() => setModal({ type: 'model', id: i.id })} style={{ ...payIconBtn }} title="Edit pay model"><Icon name="sliders" size={18} /></button>
              </div>
              {salary ? (
                <div style={{ padding: '12px 16px', fontSize: 13, color: 'var(--ink-4)', fontWeight: 600, display: 'flex', alignItems: 'center', gap: 7 }}><Icon name="info" size={15} sw={2.1} />Employed / salaried — not tracked in this ledger.</div>
              ) : (
                <div style={{ display: 'flex', gap: 8, padding: 12 }}>
                  <Btn size="sm" variant="soft" icon="plus" onClick={() => setModal({ type: 'earning', id: i.id })}>Record earning</Btn>
                  <Btn size="sm" variant="success" icon="arrow-right" onClick={() => setModal({ type: 'payment', id: i.id })}>Record payment</Btn>
                  <div style={{ flex: 1 }} />
                  <span style={{ alignSelf: 'center', fontSize: 12, color: 'var(--ink-4)' }}>{p.earnings.length} earnings · {p.payments.length} payments</span>
                </div>
              )}
            </Card>
          );
        })}
      </div>

      <Modal open={modal?.type === 'earning'} onClose={() => setModal(null)} title="Record an earning" icon="plus" width={460}>
        {modal?.type === 'earning' && <EarningForm pay={pay[modal.id]} onSave={d => { addEarning(modal.id, d); setModal(null); }} onCancel={() => setModal(null)} />}
      </Modal>
      <Modal open={modal?.type === 'payment'} onClose={() => setModal(null)} title="Record instructor payment" icon="card" tone="success" width={440}>
        {modal?.type === 'payment' && <InstrPayForm onSave={d => { addPayment(modal.id, d); setModal(null); }} onCancel={() => setModal(null)} />}
      </Modal>
      <Modal open={modal?.type === 'model'} onClose={() => setModal(null)} title="Pay model" icon="sliders" width={460}>
        {modal?.type === 'model' && <PayModelForm pay={pay[modal.id]} name={INST[modal.id].name} onSave={d => { setModel(modal.id, d); setModal(null); }} onCancel={() => setModal(null)} />}
      </Modal>
    </div>
  );
}
function Stat({ label, value, tone }) {
  return (
    <div style={{ textAlign: 'right' }}>
      <div style={{ fontSize: 10.5, fontWeight: 700, color: 'var(--ink-4)', textTransform: 'uppercase', letterSpacing: '0.03em' }}>{label}</div>

const payIconBtn = { width: 36, height: 36, borderRadius: 10, border: '1px solid var(--border-2)', background: 'var(--surface)', display: 'grid', placeItems: 'center', color: 'var(--ink-2)', cursor: 'pointer', flexShrink: 0 };

function PayModelForm({ pay, name, onSave, onCancel }) {

    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ fontSize: 13, color: 'var(--ink-3)', marginTop: -4 }}>How <b style={{ color: 'var(--ink)' }}>{name}</b> is paid for sessions.</div>
      <KField label="Pay basis"><KSelect value={basis} onChange={setBasis} options={PAY_BASES} /></KField>
      {!salary && (
        <KField label={basis === 'percentage' ? 'Percentage of session revenue' : 'Rate'}>
          <KInput prefix={payUnit(basis)} value={rate} onChange={v => setRate(v.replace(/[^0-9.]/g, ''))} placeholder="0" />
        </KField>
      )}
      {!salary && (
        <label style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '11px 13px', borderRadius: 'var(--r-sm)', border: '1px solid var(--border-2)', cursor: 'pointer' }}>
          <input type="checkbox" checked={override} onChange={e => setOverride(e.target.checked)} style={{ width: 17, height: 17, accentColor: 'var(--primary)' }} />
          <span style={{ fontSize: 13.5, fontWeight: 600, color: 'var(--ink-2)' }}>Different rate for Mod 2 escort days</span>
        </label>
      )}
      {!salary && override && (
        <KField label="Mod 2 rate"><KInput prefix={payUnit(basis)} value={mod2} onChange={v => setMod2(v.replace(/[^0-9.]/g, ''))} placeholder="0" /></KField>
      )}
      <div style={{ display: 'flex', gap: 10, marginTop: 4 }}>
        <Btn full variant="secondary" onClick={onCancel}>Cancel</Btn>
        <Btn full variant="primary" icon="check" onClick={() => onSave({ basis, rate: Number(rate) || 0, perCourse: (!salary && override && mod2) ? { mod2: Number(mod2) } : undefined })}>Save pay model</Btn>
      </div>
    </div>
  );
}

Object.assign(window, { InstructorPayScreen });

</script>

/* ---------------- Master calendar ---------------- */
const CAL_START = 8, CAL_END = 18, HOUR_H = 52;
function MasterCalendar() {
  const [loc, setLoc] = useStateA('all');
  const toMin = (t) => { const [h, m] = t.split(':').map(Number); return (h - CAL_START) * 60 + m; };
  const shown = SESSIONS.filter(s => loc === 'all' || s.loc === loc);
  return (
    <div className="ks-screen">
      <PageHead title="Master calendar" sub="All instructors, bikes & bookings · week of 8 June 2026"
        actions={<div style={{ display: 'flex', gap: 8 }}><Seg value={loc} onChange={setLoc} items={[{ value: 'all', label: 'All sites' }, ...LOCATIONS.map(l => ({ value: l.id, label: l.short }))]} /></div>} />
      <Card pad={0} style={{ overflow: 'hidden', marginBottom: 14, borderColor: 'oklch(0.7 0.135 70)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '11px 16px', background: 'var(--warning-tint)' }}>
          <Icon name="route" size={18} sw={2.2} style={{ color: 'oklch(0.55 0.13 70)', flexShrink: 0 }} />
          <div style={{ flex: 1, fontSize: 13, color: 'var(--ink-2)', fontWeight: 600 }}>
            <b>Tight travel:</b> Mark Doherty — Belfast 12:30 → Lisburn 13:00 leaves 30 min, but it's ~{TRAVEL.belfast.lisburn} min + {TRAVEL_BUFFER} buffer. Worth a check.
          </div>
          <Badge tone="warning" size="sm">Non-blocking</Badge>
        </div>
      </Card>
      <Card pad={0} style={{ overflow: 'hidden' }}>
        {/* day headers */}
        <div style={{ display: 'grid', gridTemplateColumns: '56px repeat(7, 1fr)', borderBottom: '1px solid var(--border)', background: 'var(--surface-2)' }}>
          <div />
          {WEEK_DATES.map((d, i) => {
            const isToday = i === ADMIN_TODAY;
            return (
              <div key={i} style={{ padding: '11px 8px', textAlign: 'center', borderLeft: '1px solid var(--border)' }}>
                <div style={{ fontSize: 11, fontWeight: 700, color: isToday ? 'var(--primary)' : 'var(--ink-4)', textTransform: 'uppercase' }}>{d.split(' ')[0]}</div>
                <div style={{ fontWeight: 800, fontSize: 16, color: isToday ? 'var(--primary)' : 'var(--ink)' }}>{d.split(' ')[1]}</div>
              </div>
            );
          })}
        </div>
        {/* grid */}
        <div style={{ display: 'grid', gridTemplateColumns: '56px repeat(7, 1fr)', position: 'relative' }}>
          {/* time axis */}
          <div>
            {Array.from({ length: CAL_END - CAL_START }, (_, i) => (
              <div key={i} style={{ height: HOUR_H, borderBottom: '1px solid var(--border)', position: 'relative' }}>
                <span style={{ position: 'absolute', top: -7, right: 8, fontSize: 10.5, color: 'var(--ink-4)', fontWeight: 600, fontFamily: 'var(--mono)' }}>{String(CAL_START + i).padStart(2, '0')}:00</span>
              </div>
            ))}
          </div>
          {/* day columns */}
          {WEEK_DATES.map((d, di) => (
            <div key={di} style={{ borderLeft: '1px solid var(--border)', position: 'relative', background: di === ADMIN_TODAY ? 'color-mix(in oklch, var(--primary) 4%, transparent)' : 'transparent' }}>
              {Array.from({ length: CAL_END - CAL_START }, (_, i) => (
                <div key={i} style={{ height: HOUR_H, borderBottom: '1px solid var(--border)' }} />
              ))}
              {shown.filter(s => s.day === di).map(s => {
                const c = CT[s.ct];
                const top = toMin(s.start) / 60 * HOUR_H;
                const h = Math.max((toMin(s.end) - toMin(s.start)) / 60 * HOUR_H - 4, 30);
                const full = s.booked >= s.cap;
                return (
                  <div key={s.id} title={`${c.name} · ${s.start}-${s.end}`} style={{
                    position: 'absolute', top: top + 2, left: 3, right: 3, height: h, overflow: 'hidden',

                    borderRadius: 7, padding: '5px 7px', cursor: 'pointer',
                  }}>
                    <div style={{ fontWeight: 800, fontSize: 11, color: 'var(--ink)', display: 'flex', alignItems: 'center', gap: 4 }}>
                      <span className="mono" style={{ color: c.color }}>{c.code}</span>
                    </div>
                    <div style={{ fontSize: 10.5, color: 'var(--ink-2)', fontWeight: 600 }}>{s.start} · {INST[s.inst].initials}</div>
                    {h > 56 && <div style={{ fontSize: 10, color: 'var(--ink-3)', marginTop: 2, display: 'flex', alignItems: 'center', gap: 3 }}><Icon name="pin" size={11} sw={2.2} />{LOC[s.loc].short}</div>}
                    {h > 76 && <div style={{ position: 'absolute', bottom: 5, left: 7 }}><Badge tone={full ? 'neutral' : 'success'} size="sm">{full ? 'Full' : `${s.booked}/${s.cap}`}</Badge></div>}

                );

            </div>
          ))}
        </div>
      </Card>
      <div style={{ display: 'flex', gap: 18, marginTop: 14, flexWrap: 'wrap' }}>
        {COURSE_TYPES.map(c => (
          <div key={c.id} style={{ display: 'flex', alignItems: 'center', gap: 7, fontSize: 12.5, fontWeight: 600, color: 'var(--ink-2)' }}>
            <span style={{ width: 12, height: 12, borderRadius: 3, background: c.color }} />{c.name}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- Logistics ---------------- */
function Logistics({ fire }) {
  const [moved, setMoved] = useStateA({});
  const totalNeeds = LOGISTICS.reduce((a, g) => a + g.need.length, 0);
  const doneCount = Object.keys(moved).length;
  return (
    <div className="ks-screen">
      <PageHead title="End-of-day bike logistics" sub={`Tomorrow (Wed 10 Jun): ${totalNeeds} bikes are at the wrong site for booked sessions.`} />
      <Card pad={13} style={{ background: 'var(--primary-tint)', border: 'none', display: 'flex', gap: 10, alignItems: 'center', marginBottom: 18 }}>
        <span style={{ color: 'var(--primary)', display: 'flex' }}><Icon name="info" size={19} sw={2.1} /></span>
        <div style={{ fontSize: 13, color: 'var(--primary-deep)', fontWeight: 600 }}>
          Derived live from current bike locations vs tomorrow's sessions. {SCHOOL.crossSiteNoticeHrs}h cross-site notice required. {doneCount}/{totalNeeds} arranged.
        </div>
      </Card>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
        {LOGISTICS.map(group => (
          <div key={group.dest}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 10 }}>
              <div style={{ width: 32, height: 32, borderRadius: 9, display: 'grid', placeItems: 'center', background: 'var(--primary)', color: '#fff' }}><Icon name="pin" size={17} sw={2.2} /></div>
              <span style={{ fontWeight: 800, fontSize: 16 }}>{LOC[group.dest].name} needs</span>
              <Badge tone="primary">{group.need.length} {group.need.length === 1 ? 'bike' : 'bikes'}</Badge>
            </div>
            <Card pad={6}>
              {group.need.map((n, i) => {
                const bike = BIKE[n.bike], key = `${group.dest}-${n.bike}`, isMoved = moved[key];
                return (
                  <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 13, padding: '11px 12px', borderBottom: i < group.need.length - 1 ? '1px solid var(--border)' : 'none', opacity: isMoved ? 0.6 : 1 }}>
                    <BikeGlyph cat={bike.cat} size={38} />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 700, fontSize: 14.5 }}>{bike.name} <span className="mono" style={{ fontSize: 12, color: 'var(--ink-4)' }}>{bike.reg}</span></div>
                      <div style={{ fontSize: 12.5, color: 'var(--ink-3)', display: 'flex', alignItems: 'center', gap: 6, marginTop: 2 }}>
                        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}><Icon name="pin" size={13} sw={2.1} />{LOC[n.from].short}</span>
                        <Icon name="arrow-right" size={14} sw={2.2} style={{ color: 'var(--ink-4)' }} />
                        <span style={{ fontWeight: 700, color: 'var(--ink-2)' }}>{LOC[group.dest].short}</span>
                        <span style={{ color: 'var(--ink-4)' }}>· for {n.forSession}</span>
                      </div>
                    </div>
                    {isMoved
                      ? <Badge tone="success" icon="check">Arranged</Badge>
                      : <Btn size="sm" variant="secondary" icon="check" onClick={() => { setMoved(m => ({ ...m, [key]: 1 })); fire('Move scheduled', 'route'); }}>Mark moved</Btn>}
                  </div>
                );
              })}
            </Card>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ---------------- Instructors ---------------- */
const INST_TONES = [277, 160, 70, 25, 195, 305, 340];
function Instructors({ fire }) {
  const [list, setList] = useStateA(INSTRUCTORS);
  const [add, setAdd] = useStateA(false);
  const [canPay, setCanPay] = useStateA(SCHOOL.instructorsCanRecordPayments);
  const togglePay = () => { const v = !canPay; setCanPay(v); SCHOOL.instructorsCanRecordPayments = v; fire(v ? 'Instructors can now record payments' : 'Payment recording turned off', 'check-circle'); };
  const save = (data) => { setList(x => [...x, { ...data, id: 'i' + Date.now(), tone: INST_TONES[x.length % INST_TONES.length] }]); setAdd(false); fire('Instructor added', 'check-circle'); };
  return (
    <div className="ks-screen">
      <PageHead title="Instructors" sub="Manage staff, qualifications & availability." actions={<Btn icon="plus" onClick={() => setAdd(true)}>Add instructor</Btn>} />
      <Card pad={16} style={{ marginBottom: 16, display: 'flex', alignItems: 'center', gap: 14 }}>
        <div style={{ width: 40, height: 40, borderRadius: 11, flexShrink: 0, display: 'grid', placeItems: 'center', background: 'var(--primary-tint)', color: 'var(--primary)' }}><Icon name="card" size={20} /></div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 800, fontSize: 14.5 }}>Instructors can record payments</div>
          <div style={{ fontSize: 12.5, color: 'var(--ink-3)', lineHeight: 1.4 }}>Lets instructors take cash/card in the field (record-only — they can't void payments or edit charges). Recorded-by is logged.</div>
        </div>
        <Switch on={canPay} onClick={togglePay} />
      </Card>

const { useState: useStateSh, useRef: useRefSh, useEffect: useEffectSh } = React;

/* Scales child to fit the available area, letterboxed on the stage bg. */
function Fit({ w, h, children }) {
  const wrap = useRefSh(null);
  const [scale, setScale] = useStateSh(1);
  useEffectSh(() => {
    const el = wrap.current;
    if (!el) return;
    const ro = new ResizeObserver(() => {
      const aw = el.clientWidth - 48, ah = el.clientHeight - 48;
      setScale(Math.min(aw / w, ah / h, 1));
    });
    ro.observe(el);
    return () => ro.disconnect();
  }, [w, h]);
  return (
    <div ref={wrap} style={{ flex: 1, minHeight: 0, display: 'grid', placeItems: 'center', overflow: 'hidden' }}>
      <div style={{ width: w, height: h, transform: `scale(${scale})`, transformOrigin: 'center', flexShrink: 0 }}>
        {children}
      </div>
    </div>
  );
}

};
const CORNERS = {
  rounded: { '--r-xs': '8px', '--r-sm': '11px', '--r': '14px', '--r-lg': '20px', '--r-xl': '28px' },
  soft:    { '--r-xs': '6px', '--r-sm': '8px',  '--r': '10px', '--r-lg': '13px', '--r-xl': '17px' },
  sharp:   { '--r-xs': '2px', '--r-sm': '3px',  '--r': '4px',  '--r-lg': '5px',  '--r-xl': '7px'  },
};

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": false,
  "accent": "indigo",
  "font": "jakarta",
  "corners": "rounded"
}/*EDITMODE-END*/;

function Shell() {
  const [role, setRole] = useStateSh('home');
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const theme = t.dark ? 'dark' : 'light';
  const hue = (ACCENTS.find(a => a.id === t.accent) || ACCENTS[0]).hue;
  const rootVars = { '--primary-h': hue, '--font': FONTS[t.font] || FONTS.jakarta, ...CORNERS[t.corners] };

  const App = role === 'student' ? window.StudentApp
            : role === 'instructor' ? window.InstructorApp
            : role === 'admin' ? window.AdminApp : null;
  const [studentStatus, setStudentStatus] = useStateSh('active');

  return (
    <div className="ks" data-theme={theme}
      style={{ ...rootVars, height: '100vh', display: 'flex', flexDirection: 'column', background: 'var(--bg)' }}>
      {/* top bar */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '12px 18px', borderBottom: '1px solid var(--border)', background: 'var(--surface)', flexShrink: 0, zIndex: 10 }}>
        <button onClick={() => setRole('home')} style={{ border: 'none', background: 'transparent', cursor: 'pointer', padding: 0 }}><KSLogo size={28} /></button>
        <div style={{ flex: 1 }} />
        <Seg value={role === 'home' ? '' : role} onChange={setRole}
          items={ROLES.map(r => ({ value: r.id, label: r.label, icon: r.icon }))} />
        <button onClick={() => setTweak('dark', !t.dark)} title="Toggle theme"
          style={{ width: 40, height: 40, borderRadius: 11, border: '1px solid var(--border)', background: 'var(--surface)', display: 'grid', placeItems: 'center', color: 'var(--ink-2)', cursor: 'pointer' }}>
          <Icon name={theme === 'light' ? 'moon' : 'sun'} size={19} />
        </button>
      </div>

      {/* stage */}
      {role === 'home' && <Launcher go={setRole} />}
      {role === 'onboarding' && (
        <Fit w={402} h={874}>
          <window.AuthApp theme={theme} onFinish={(status) => { setStudentStatus(status || 'active'); setRole('student'); }} />
        </Fit>
      )}
      {role !== 'home' && role !== 'onboarding' && App && (
        <Fit w={role === 'admin' ? 1320 : 402} h={role === 'admin' ? 860 : 874}>
          <App theme={theme} status={role === 'student' ? studentStatus : undefined} />
        </Fit>
      )}
      {role !== 'home' && role !== 'onboarding' && !App && (
        <div style={{ flex: 1, display: 'grid', placeItems: 'center', color: 'var(--ink-4)', fontWeight: 700 }}>
          Building {role}…
        </div>
      )}

      {/* Tweaks */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="Theme" />
        <TweakRadio label="Mode" value={t.dark ? 'dark' : 'light'} options={['light', 'dark']} onChange={v => setTweak('dark', v === 'dark')} />
        <TweakRow label="Accent">
          <div style={{ display: 'flex', gap: 7, flexWrap: 'wrap' }}>
            {ACCENTS.map(a => (
              <button key={a.id} onClick={() => setTweak('accent', a.id)} title={a.label}
                style={{ width: 24, height: 24, borderRadius: 999, cursor: 'pointer', background: `oklch(0.6 0.19 ${a.hue})`,
                  border: t.accent === a.id ? '2px solid #fff' : '2px solid transparent',
                  boxShadow: t.accent === a.id ? `0 0 0 2px oklch(0.6 0.19 ${a.hue})` : '0 0 0 1px rgba(0,0,0,.12)' }} />
            ))}
          </div>
        </TweakRow>
        <TweakSection label="Type & shape" />
        <TweakSelect label="Typeface" value={t.font}
          options={[{ value: 'jakarta', label: 'Plus Jakarta Sans' }, { value: 'manrope', label: 'Manrope' }, { value: 'grotesk', label: 'Space Grotesk' }]}
          onChange={v => setTweak('font', v)} />
        <TweakRadio label="Corners" value={t.corners} options={['rounded', 'soft', 'sharp']} onChange={v => setTweak('corners', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Shell />);

</script>
</body>
</html>
