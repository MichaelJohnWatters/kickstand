# Portable deployment for the Kickstand API: the Go server behind Caddy,
# which terminates TLS (automatic Let's Encrypt via KS_DOMAIN) and reverse-
# proxies to it. Runs on any Docker host — a VPS, a Pi, Fly (as a machine),
# or Cloud Run with a mounted volume.
#
# First run:
#   cp .env.example .env     # then edit it (set JWT_SIGNING_KEY!)
#   docker compose up -d --build
#
# Provision the first school (see README):
#   docker compose run --rm --entrypoint provision app \
#     -dsn /data/kickstand.db -name "Acme Rider" -region NI \
#     -owner-email owner@acme.example -owner-name "Owner" -owner-password '...'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # CORS allow-list — the web app origin(s). REQUIRED in prod: the API
      # fails closed and rejects unknown origins.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      # Auth: HS256 signing key for access + refresh tokens. REQUIRED in prod.
      - JWT_SIGNING_KEY=${JWT_SIGNING_KEY:-}
      # Base URL for the emailed password-reset link (<WEB_APP_URL>?token=...).
      - WEB_APP_URL=${WEB_APP_URL:-}
      # Transactional email (incl. password-reset links). SMTP_HOST set → real
      # sending; else EMAIL_LOG=1 → log only; else email queues but isn't sent.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-}
      - EMAIL_LOG=${EMAIL_LOG:-}
      # Optional crash-alert webhook (Slack/Discord/collector).
      - ERROR_WEBHOOK=${ERROR_WEBHOOK:-}
      # Dedicated single-tenant instance: pin to one school id. Empty = shared.
      - KS_SINGLE_TENANT_SCHOOL_ID=${KS_SINGLE_TENANT_SCHOOL_ID:-}
    volumes:
      - kickstand-data:/data          # SQLite db + local receipt uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8765/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    expose:
      - "8765"
    # To run WITHOUT Caddy (e.g. behind an existing proxy), delete the caddy
    # service below and publish the port directly:
    # ports: ["8765:8765"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - KS_DOMAIN=${KS_DOMAIN:?set KS_DOMAIN to your public hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kickstand-data:
  caddy-data:
  caddy-config:
